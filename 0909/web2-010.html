<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>div与span</title>
</head>
<body>
    <h3>块级与内联</h3>
    <hr>
    <div style="background:skyblue; padding:20px;">
        这是div块，独占一行。
        <span style="color:red;">这行文字变红</span>，
        只有这里变红。
    </div>
</body>
</html>
