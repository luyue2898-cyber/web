<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>图片表格</title>
</head>
<body>
    <h3>常见水果</h3>
    <hr>
    <table>
        <caption>水果图片</caption>
        <tbody>
            <tr>
                <td><img src="appple.jpg" width="100"></td>
                <td><img src="banana.jpg" width="100"></td>
                <td><img src="orange.jpg" width="100"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
