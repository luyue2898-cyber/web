<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>文本样式</title>
</head>
<body>
    <h3>文本装饰</h3>
    <hr>
    <p>
        <b>加粗文字</b><br>
        <strong>强调文字</strong><br>
        <em>斜体强调</em><br>
        <i>斜体文字</i><br>
        <b><i>加粗又斜体</i></b><br>
        普通<small>小一号</small><br>
        <del>删除线</del><br>
        <ins>下划线（插入）</ins><br>
        上标：X<sup>2</sup><br>
        下标：H<sub>2</sub>O<br>
        <mark>高亮背景</mark>
    </p>
</body>
</html>
