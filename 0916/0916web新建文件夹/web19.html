<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Time Input Application</title>
</head>

<body>
    <h3>Happy Birthday</h3>
    <hr>
    Your birthday is February 9, 2003. Correct it if wrong and
    enter the party time and location.
    <hr>
    <form>
        <table>
            <tr>
                <td>Birthday</td>
                <td><input type="date" value="2003-02-09"></td>
            </tr>
            <tr>
                <td>Birthday Party Time</td>
                <td><input type="time"></td>
            </tr>
            <tr>
                <td>Birthday Party Location</td>
                <td><input type="text"></td>
            </tr>
        </table>
    </form>
</body>

</html>
