<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Input Form with Buttons</title>
</head>

<body>
    <h3>Let's Create Buttons</h3>
    <hr>
    <form>
        Search: <input type="text" size="10" value="">
        <input type="button" value="Q1">
        <button type="button">Q2</button><br>
        submit button : <input type="submit" value="Submit1">
        <button type="submit">Submit2</button><br>
        reset button : <input type="reset" value="Reset1">
        <button type="reset">Reset2</button><br>
        image button : <input type="image" src="media/button.png" alt="Image Button">
        <button type="button">
            < img src="media/button.png" alt="Image Button">
        </button>
    </form>
</body>

</html>
