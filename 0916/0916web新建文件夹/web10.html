<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Text Input with Data List</title>
</head>

<body>
    <h3>Places I Want to Visit</h3>
    <hr>
    <form>
        Country : <input type="text" list="countries"><br>
        <datalist id="countries">
            <option value="Ghana">
            <option value="Switzerland">
            <option value="Brazil">
        </datalist>
        Things to see : <input type="text" list="what"><br>
        <datalist id="what">
            <option value="Mountains">
            <option value="Sea">
            <option value="City">
        </datalist>
    </form>
</body>

</html>
