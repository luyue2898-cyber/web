<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Create Checkboxes</title>
</head>

<body>
    <h3>Check all the foods you want to eat</h3>
    <hr>
    <form>
        Jajangmyeon <input type="checkbox" value="1">
        Jjamppong <input type="checkbox" value="2" checked>
        Tangsuyuk <input type="checkbox" value="3">
    </form>
</body>

</html>
