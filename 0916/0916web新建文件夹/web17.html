<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Color Input</title>
</head>

<body>
    <h3>Input Color Using Color Dialog</h3>
    <hr>
    <form>
        Select Color
        <input type="color" value="#00BFFF" onchange="document.body.style.color=this.value">
    </form>
</body>

</html>
