<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Radio Buttons with Caption</title>
</head>

<body>
    <h3>Choose only one food you want to eat?(Using &lt;label&gt;)</h3>
    <hr>
    <form>
        <label>
            <input type="radio" name="china" value="1">
            Jajangmyeon < img src="media/jajang.png">
        </label><br>
        <label>
            <input type="radio" name="china" value="2" checked>
            Jjamppong < img src="media/jjambbong.png">
        </label><br>
        <label>
            <input type="radio" name="china" value="3">
            Tangsuyuk < img src="media/tangsuyuk.png">
        </label>
    </form>
</body>

</html>
