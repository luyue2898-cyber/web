<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Using the figure Tag</title>
</head>

<body>
    <h3>Using the figure Tag</h3>
    <hr>
    <figure id="1-1">
        <figcaption>Using the alert() function</figcaption>
        <pre>
<code>function f() { alert("Warning"); }</code>
</pre>
        <hr>
        <small>Execution Result</small>
        <pre>
< img src="media/alert.png" alt="Execution Result">
</pre>
    </figure>
</body>

</html>
