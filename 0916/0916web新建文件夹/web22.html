<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grouping Form Inputs</title>
</head>

<body>
    <h3>Please enter your member information.</h3>
    <hr>
    <form>
        <fieldset>
            <legend>Member Information</legend>
            Email : <input type="email"><br>
            Homepage : <input type="url"><br>
            Phone Number : <input type="tel">
        </fieldset>
        <small>Question : Tel. 010-111-1111</small>
    </form>
</body>

</html>
