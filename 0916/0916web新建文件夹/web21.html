<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Formatted Text Input</title>
</head>

<body>
    <h3>Please enter your member information.</h3>
    <hr>
    <form>
        email : <input type="email" placeholder="id@host"><br>
        Homepage : <input type="url" placeholder="http://"><br>
        Phone number : <input type="tel" placeholder="010‑1234‑5678">
        <input type="submit" value="Confirm"><br><br>
        <hr>
        Search keyword : <input type="search" placeholder="Search keyword">
        <input type="button" value="Search">
    </form>
</body>

</html>
